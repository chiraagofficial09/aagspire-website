<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/fire-logo.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Aagspire</title>

    <meta
      name="description"
      content="Aagspire is a premium branding and design studio crafting unforgettable digital experiences and brand identities."
    />

    <meta property="og:image" content="/Aagspire_Logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/Aagspire_Logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <style>
      #anti-screenshot-shield {
        position: fixed;
        inset: 0;
        z-index: 2147483647;

        display: none;
        align-items: center;
        justify-content: center;

        padding: 20px;

        background: rgba(0, 0, 0, 0.82);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        cursor: pointer;
      }

      #anti-screenshot-shield.active {
        display: flex;
      }

      .protection-card {
        width: min(380px, 90vw);

        padding: 28px 24px;

        background: #111111;

        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;

        text-align: center;

        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

        font-family:
          Inter,
          Arial,
          sans-serif;
      }

      .protection-icon {
        width: 42px;
        height: 42px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin: 0 auto 18px;

        border-radius: 12px;

        background: rgba(255, 90, 31, 0.1);

        color: #ff5a1f;
      }

      .protection-icon svg {
        width: 21px;
        height: 21px;
      }

      .protection-card h2 {
        margin: 0 0 10px;

        color: #ffffff;

        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
      }

      .protection-card h2 span {
        color: #ff5a1f;
      }

      .protection-card p {
        margin: 0;

        color: rgba(255, 255, 255, 0.5);

        font-size: 12px;
        line-height: 1.6;
      }
    </style>
  </head>

  <body
    oncontextmenu="return false;"
    ondragstart="return false;"
  >
    <div id="root"></div>

    <div id="anti-screenshot-shield" aria-hidden="true">
      <div class="protection-card">

        <div class="protection-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="5" y="11" width="14" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
        </div>

        <h2>
          This artwork is protected by
          <span>Aagspire</span>
        </h2>

        <p>
          Unauthorized copying, reproduction or distribution is prohibited.
        </p>

      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
