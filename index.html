<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/fire-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aagspire</title>
    <meta name="description" content="Aagspire is a premium branding and design studio crafting unforgettable digital experiences and brand identities." />
    <meta property="og:image" content="/Aagspire_Logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/Aagspire_Logo.png" />
  </head>
  <body oncontextmenu="return false;" ondragstart="return false;">
    <div id="root"></div>

    <!-- Anti-Screenshot & Snipping Tool Privacy Shield (Instant 0ms pure CSS blackout) -->
    <div id="anti-screenshot-shield" aria-hidden="true">
      <div class="anti-screenshot-content">
        <div class="anti-screenshot-icon-wrap">
          <svg class="anti-screenshot-icon" viewBox="0 0 24 24" fill="none" stroke="#FF5A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div class="anti-screenshot-tag">SCREEN CAPTURE RESTRICTED</div>
        <h2 class="anti-screenshot-title">Protected Intellectual Property</h2>
        <p class="anti-screenshot-desc">
          All artworks, portfolio items, and visual identities are proprietary to <strong>Aagspire Studio</strong>. Snipping Tool and screen capture are restricted to safeguard client work and copyright.
        </p>
        <div class="anti-screenshot-tip">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
          </svg>
          <span>Click anywhere to resume browsing</span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
